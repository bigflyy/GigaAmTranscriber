name: Publish CPU and CUDA containers

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version tag (for example v0.2.0)
        required: true
        default: v0.2.0

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        edition: [cpu, cuda]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build, smoke-test and publish
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EDITION: ${{ matrix.edition }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build --build-arg "ORT_VARIANT=$EDITION" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.description=GigaAM Transcriber $EDITION command-line image on ONNX Runtime; RNNT and CTC models included" \
            -t "$image:$VERSION-$EDITION" -t "$image:$EDITION" .
          docker run --rm --network none "$image:$VERSION-$EDITION" --version
          # Offline transcription of a short silent file, on the CPU (runners have no GPU).
          docker run --rm --network none --entrypoint sh "$image:$VERSION-$EDITION" -c \
            "ffmpeg -v error -f lavfi -i anullsrc=r=16000:cl=mono -t 2 /tmp/silence.wav \
             && python -m gigaam_app.cli /tmp/silence.wav --device cpu --model RNNT \
             && python -m gigaam_app.cli /tmp/silence.wav --device cpu --model CTC"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$image:$VERSION-$EDITION"
          docker push "$image:$EDITION"
